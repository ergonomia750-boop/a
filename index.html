<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola do Futuro — O Desafio da Transformação</title>
<style>
  :root{
    --azul:#2563eb;
    --azul-esc:#1e40af;
    --roxo:#7c3aed;
    --roxo-esc:#5b21b6;
    --branco:#ffffff;
    --amarelo:#facc15;
    --amarelo-esc:#eab308;
    --cinza:#f1f5f9;
    --texto:#0f172a;
    --sombra:0 10px 30px rgba(30,64,175,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,#e0e7ff 0%,#f5f3ff 50%,#fef9c3 100%);
    color:var(--texto);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:12px;overflow-x:hidden;
  }
  .app{
    width:100%;max-width:1000px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(14px);
    border-radius:24px;
    box-shadow:var(--sombra);
    padding:20px;
    position:relative;
    min-height:calc(100vh - 24px);
    display:flex;flex-direction:column;
  }
  h1,h2,h3{color:var(--azul-esc);}
  h1{font-size:clamp(1.3rem,4vw,2rem);line-height:1.2;}
  h2{font-size:clamp(1.1rem,3vw,1.5rem);margin-bottom:6px;}
  p{line-height:1.55;color:#334155;}
  .hidden{display:none !important;}

  /* HEADER */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;flex-wrap:wrap;margin-bottom:14px;
  }
  .badge{
    background:linear-gradient(135deg,var(--roxo),var(--azul));
    color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:.85rem;
    box-shadow:0 4px 12px rgba(124,58,237,.35);
  }
  .score-box{
    background:var(--amarelo);color:#713f12;padding:6px 14px;border-radius:20px;
    font-weight:800;font-size:.85rem;box-shadow:0 4px 12px rgba(250,204,21,.5);
    transition:transform .3s;
  }
  .score-box.pulse{transform:scale(1.15);}

  /* PROGRESS */
  .progress-wrap{
    width:100%;height:14px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:18px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.08);
  }
  .progress-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--azul),var(--roxo),var(--amarelo));
    background-size:200% 100%;
    border-radius:10px;transition:width .6s ease;
    animation:flow 3s linear infinite;
  }
  @keyframes flow{0%{background-position:0% 0}100%{background-position:200% 0}}

  /* BOTÕES */
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:14px;
    font-weight:700;font-size:1rem;padding:14px 26px;
    transition:transform .15s, box-shadow .2s, filter .2s;
  }
  button:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg,var(--azul),var(--roxo));color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.35);
  }
  .btn-primary:hover{filter:brightness(1.1);box-shadow:0 10px 26px rgba(124,58,237,.45);}
  .btn-yellow{
    background:linear-gradient(135deg,var(--amarelo),#f59e0b);color:#713f12;
    box-shadow:0 8px 20px rgba(250,204,21,.45);
  }
  .btn-ghost{
    background:#fff;color:var(--azul-esc);border:2px solid #c7d2fe;font-size:.9rem;padding:10px 18px;
  }
  .btn-ghost:hover{background:#eef2ff;}
  .btn-restart{
    background:#fff;color:#b91c1c;border:2px solid #fecaca;font-size:.85rem;padding:8px 16px;
    position:absolute;top:16px;right:16px;z-index:10;
  }
  .btn-restart:hover{background:#fef2f2;}

  /* TELAS */
  .screen{animation:fadeIn .5s ease;flex:1;display:flex;flex-direction:column;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* TELA INICIAL */
  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;padding:20px 10px;
  }
  .hero-icon{font-size:clamp(4rem,14vw,7rem);animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .hero p{max-width:520px;font-size:1.05rem;}
  .hero .tag{
    background:#eef2ff;color:var(--roxo-esc);padding:8px 18px;border-radius:20px;
    font-weight:600;font-size:.85rem;
  }

  /* FASE 1 — DRAG DROP */
  .fase-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;}
  @media(max-width:700px){.fase-grid{grid-template-columns:1fr;}}
  .panel{
    background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(30,64,175,.08);
    border:2px dashed #c7d2fe;min-height:120px;
  }
  .panel h3{font-size:.95rem;margin-bottom:10px;color:var(--roxo-esc);}
  .zone{
    background:linear-gradient(135deg,#f8fafc,#eef2ff);
    border:2px dashed #a5b4fc;border-radius:14px;
    padding:10px;min-height:70px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
    transition:background .2s,border-color .2s;
  }
  .zone.over{background:#ddd6fe;border-color:var(--roxo);}
  .zone-label{font-size:.78rem;font-weight:700;color:#64748b;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px;}
  .item{
    display:flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,#fff,#f1f5f9);
    border:2px solid #e2e8f0;border-radius:12px;
    padding:8px 12px;font-size:.85rem;font-weight:600;cursor:grab;
    box-shadow:0 3px 8px rgba(0,0,0,.06);
    transition:transform .15s, box-shadow .15s, border-color .15s;
    user-select:none;touch-action:none;color:var(--azul-esc);
  }
  .item:hover{border-color:var(--roxo);transform:translateY(-2px);box-shadow:0 6px 14px rgba(124,58,237,.2);}
  .item.dragging{opacity:.4;cursor:grabbing;}
  .item .emoji{font-size:1.2rem;}
  .item.placed{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22c55e;color:#166534;}
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:10px;background:#fef9c3;border-radius:14px;border:2px dashed #fde047;}

  /* FASE 2 — TIMELINE */
  .timeline{
    display:flex;flex-direction:column;gap:10px;margin-top:10px;
  }
  .slot{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:2px dashed #c7d2fe;border-radius:14px;padding:10px;min-height:62px;
    transition:background .2s,border-color .2s;
  }
  .slot.over{background:#ede9fe;border-color:var(--roxo);}
  .slot-num{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--azul),var(--roxo));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;
  }
  .slot-drop{flex:1;display:flex;flex-wrap:wrap;gap:8px;min-height:40px;align-items:center;}
  .slot-drop .placeholder{color:#94a3b8;font-size:.85rem;font-style:italic;}
  .timeline .item.tl{width:auto;}

  /* FASE 3/4 - TEXTAREA */
  textarea{
    width:100%;min-height:140px;resize:vertical;
    border:2px solid #c7d2fe;border-radius:14px;padding:14px;
    font-family:inherit;font-size:1rem;color:var(--texto);
    background:#fff;transition:border-color .2s, box-shadow .2s;
  }
  textarea:focus{outline:none;border-color:var(--roxo);box-shadow:0 0 0 4px rgba(124,58,237,.15);}

  /* FASE 4 — REDE */
  .net{
    position:relative;background:radial-gradient(circle at center,#eef2ff,#e0e7ff);
    border-radius:18px;min-height:340px;padding:16px;margin-top:10px;
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
  }
  .node{
    background:#fff;border:2px solid #c7d2fe;border-radius:16px;padding:10px 14px;
    font-size:.85rem;font-weight:700;color:var(--azul-esc);cursor:pointer;
    box-shadow:0 4px 10px rgba(30,64,175,.1);transition:all .25s;
    display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px;
  }
  .node .emoji{font-size:1.8rem;}
  .node.selected{border-color:var(--amarelo);background:#fef9c3;transform:scale(1.06);box-shadow:0 8px 20px rgba(250,204,21,.5);}
  .node.connected{border-color:#22c55e;background:#f0fdf4;}
  .net-lines{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  .net .node{z-index:2;}
  .conn-count{font-size:.75rem;color:#64748b;margin-top:8px;text-align:center;}

  /* FEEDBACK */
  .feedback{
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    border-left:5px solid var(--roxo);border-radius:14px;padding:16px;margin-top:14px;
    animation:fadeIn .4s;font-size:.95rem;
  }
  .feedback strong{color:var(--roxo-esc);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end;}

  /* FINAL */
  .final-hero{
    text-align:center;padding:20px;
    background:linear-gradient(135deg,#eef2ff,#fef9c3);border-radius:20px;margin-bottom:16px;
  }
  .final-hero .big{font-size:clamp(2.5rem,10vw,4rem);}
  .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0;}
  .result-card{
    background:#fff;border-radius:16px;padding:16px;text-align:center;
    box-shadow:0 6px 18px rgba(30,64,175,.1);border-top:4px solid var(--roxo);
  }
  .result-card .num{font-size:2rem;font-weight:900;color:var(--azul);}
  .result-card .lbl{font-size:.8rem;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .ideas-list{display:flex;flex-direction:column;gap:10px;margin:12px 0;}
  .idea{
    background:#fff;border-radius:12px;padding:12px 16px;border-left:4px solid var(--amarelo);
    font-size:.9rem;color:#334155;
  }
  .idea .tag{font-size:.7rem;color:var(--roxo-esc);font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
  .final-quote{
    text-align:center;font-style:italic;font-size:1.05rem;color:var(--roxo-esc);
    padding:20px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);border-radius:16px;margin-top:16px;
    font-weight:600;line-height:1.5;
  }

  .fade-in{animation:fadeIn .5s ease;}
  .mission-tag{font-size:.8rem;color:var(--roxo-esc);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .muted{color:#64748b;font-size:.9rem;}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="btn-restart hidden" id="btnRestart" onclick="restartGame()">↻ Reiniciar</button>

  <div class="topbar hidden" id="topbar">
    <span class="badge" id="missionBadge">Missão 1 de 4</span>
    <span class="score-box" id="scoreBox">⭐ 0 pts</span>
  </div>
  <div class="progress-wrap hidden" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="screens"></div>
</div>

<script>
/* ============================================================
   ESTADO GLOBAL
============================================================ */
const state = {
  score: 0,
  phase: 0, // 0=inicio, 1..4, 5=final
  phase1Done:false,
  phase2Done:false,
  phase3Idea:'',
  phase4Idea:'',
  connections:0,
  phaseScores:{1:0,2:0,3:0,4:0}
};

const screensEl = document.getElementById('screens');
const topbar = document.getElementById('topbar');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const scoreBox = document.getElementById('scoreBox');
const missionBadge = document.getElementById('missionBadge');
const btnRestart = document.getElementById('btnRestart');

function updateHUD(){
  scoreBox.textContent = '⭐ ' + state.score + ' pts';
  const pct = state.phase>=1 && state.phase<=4 ? ((state.phase-1)/4)*100 + 25 : 0;
  // progresso baseado em missões concluídas
  const done = [state.phase1Done,state.phase2Done,!!state.phase3Idea,!!state.phase4Idea].filter(Boolean).length;
  progressBar.style.width = (done/4*100) + '%';
  if(state.phase>=1 && state.phase<=4){
    missionBadge.textContent = 'Missão ' + state.phase + ' de 4';
  } else if(state.phase===5){
    missionBadge.textContent = '🏆 Concluído';
  }
}

function addScore(pts, label){
  state.score += pts;
  updateHUD();
  scoreBox.classList.add('pulse');
  setTimeout(()=>scoreBox.classList.remove('pulse'),350);
}

function showHUD(show){
  topbar.classList.toggle('hidden',!show);
  progressWrap.classList.toggle('hidden',!show);
  btnRestart.classList.toggle('hidden',!show);
}

function clearScreen(){ screensEl.innerHTML=''; }

/* ============================================================
   TELA INICIAL
============================================================ */
function renderStart(){
  state.phase = 0;
  showHUD(false);
  clearScreen();
  const div = document.createElement('div');
  div.className='screen';
  div.innerHTML = `
    <div class="hero">
      <div class="hero-icon">🏫✨</div>
      <span class="tag">SÍNTESE 2026 · Projeto Escolar</span>
      <h1>ESCOLA DO FUTURO<br><span style="color:var(--roxo)">O Desafio da Transformação</span></h1>
      <p>Assuma o papel de <strong>agente de transformação</strong> e use inovação, criatividade e tecnologia consciente para tornar a escola um lugar mais participativo, colaborativo e engajador.</p>
      <p class="muted">4 missões interativas · arraste, organize, conecte e crie.</p>
      <button class="btn-primary" style="font-size:1.15rem;padding:16px 40px" onclick="startGame()">🚀 Começar Missão</button>
    </div>`;
  screensEl.appendChild(div);
}

function startGame(){
  state.phase = 1;
  showHUD(true);
  updateHUD();
  renderPhase1();
}

/* ============================================================
   FASE 1 — RECONSTRUINDO A SALA DE AULA (drag & drop)
============================================================ */
const phase1Items = [
  {id:'p1', emoji:'🪑', label:'Mesas em grupo', zone:'grupo'},
  {id:'p2', emoji:'💻', label:'Notebooks', zone:'tec'},
  {id:'p3', emoji:'📚', label:'Estante de livros', zone:'leitura'},
  {id:'p4', emoji:'🎨', label:'Materiais de arte', zone:'criativa'},
  {id:'p5', emoji:'📽️', label:'Projetor', zone:'tec'},
  {id:'p6', emoji:'🛋️', label:'Cantinho de leitura', zone:'leitura'},
  {id:'p7', emoji:'🧩', label:'Jogos educativos', zone:'grupo'},
  {id:'p8', emoji:'✏️', label:'Materiais criativos', zone:'criativa'},
];

function renderPhase1(){
  clearScreen();
  const div = document.createElement('div');
  div.className='screen';
  div.innerHTML = `
    <div class="mission-tag">Missão 1 · Reconstruindo a Sala de Aula</div>
    <h2>Organize o ambiente escolar</h2>
    <p>A sala está desorganizada! <strong>Arraste</strong> cada elemento para a área correta. Um ambiente bem pensado aumenta o engajamento e a participação.</p>
    <div class="fase-grid" style="margin-top:14px">
      <div class="panel">
        <h3>🎯 Elementos para posicionar</h3>
        <div class="pool" id="pool"></div>
        <p class="muted" style="margin-top:8px;font-size:.8rem">Arraste para as áreas ao lado →</p>
      </div>
      <div class="panel" id="zonesPanel">
        <h3>🏫 Áreas da sala</h3>
        <div class="zone-label">👥 Trabalho em grupo</div>
        <div class="zone" data-zone="grupo"></div>
        <div class="zone-label">💻 Recursos tecnológicos</div>
        <div class="zone" data-zone="tec"></div>
        <div class="zone-label">📖 Espaço de leitura</div>
        <div class="zone" data-zone="leitura"></div>
        <div class="zone-label">🎨 Atividades criativas</div>
        <div class="zone" data-zone="criativa"></div>
      </div>
    </div>
    <div class="feedback hidden" id="fb1"></div>
    <div class="actions">
      <button class="btn-primary hidden" id="next1" onclick="finishPhase1()">Avançar para Missão 2 →</button>
    </div>`;
  screensEl.appendChild(div);

  const pool = div.querySelector('#pool');
  phase1Items.forEach(it=>{
    const el = makeItem(it, 'p1');
    pool.appendChild(el);
  });

  // zones
  div.querySelectorAll('.zone').forEach(zone=>{
    setupDropZone(zone, (itemEl)=>{
      const zoneType = zone.dataset.zone;
      if(itemEl.dataset.zone === zoneType){
        itemEl.classList.add('placed');
        itemEl.style.cursor='default';
        zone.appendChild(itemEl);
        itemEl.draggable=false;
        checkPhase1();
      } else {
        // feedback visual rápido de erro
        zone.style.borderColor='#ef4444';
        setTimeout(()=>zone.style.borderColor='',400);
      }
    });
  });

  setupPoolDrops(pool);
}

function makeItem(it, phase){
  const el = document.createElement('div');
  el.className='item';
  el.draggable = true;
  el.dataset.zone = it.zone;
  el.dataset.id = it.id;
  el.innerHTML = `<span class="emoji">${it.emoji}</span><span>${it.label}</span>`;
  setupDrag(el);
  return el;
}

/* Drag & Drop unificado (mouse + touch via HTML5 drag + fallback touch) */
let touchDragEl = null;
function setupDrag(el){
  el.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', el.dataset.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', ()=> el.classList.remove('dragging'));

  // Touch support
  el.addEventListener('touchstart', e=>{
    touchDragEl = el;
    el.classList.add('dragging');
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(!touchDragEl) return;
    const t = e.touches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    document.querySelectorAll('.zone.over,.slot.over,.pool.over').forEach(z=>z.classList.remove('over'));
    const drop = target && target.closest('.zone, .slot, .pool');
    if(drop) drop.classList.add('over');
    e.preventDefault();
  }, {passive:false});
  el.addEventListener('touchend', e=>{
    if(!touchDragEl) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const drop = target && target.closest('.zone, .slot, .pool');
    if(drop){
      if(drop.classList.contains('zone')) handleZoneDrop(drop, el);
      else if(drop.classList.contains('slot')) handleSlotDrop(drop, el);
      else if(drop.classList.contains('pool')) drop.appendChild(el);
    }
    el.classList.remove('dragging');
    document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'));
    touchDragEl = null;
  });
}

function setupDropZone(zone, onDrop){
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if(el) onDrop(el);
  });
  // touch handled in setupDrag
}
function setupPoolDrops(pool){
  pool.addEventListener('dragover', e=>{ e.preventDefault(); pool.classList.add('over'); });
  pool.addEventListener('dragleave', ()=> pool.classList.remove('over'));
  pool.addEventListener('drop', e=>{
    e.preventDefault(); pool.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if(el){ el.classList.remove('placed'); pool.appendChild(el); }
  });
}
function handleZoneDrop(zone, el){
  if(el.dataset.zone === zone.dataset.zone){
    el.classList.add('placed'); el.draggable=false; zone.appendChild(el);
    checkPhase1();
  } else {
    zone.style.borderColor='#ef4444';
    setTimeout(()=>zone.style.borderColor='',400);
  }
}

function checkPhase1(){
  const placed = document.querySelectorAll('.zone .item.placed').length;
  if(placed === phase1Items.length && !state.phase1Done){
    state.phase1Done = true;
    addScore(100,'fase1');
    updateHUD();
    const fb = document.getElementById('fb1');
    fb.classList.remove('hidden');
    fb.innerHTML = `
      <strong>✅ Sala reconstruída!</strong><br>
      Um ambiente escolar organizado, com espaços para colaboração, leitura, criatividade e tecnologia,
      <strong>aumenta o engajamento</strong> dos estudantes. Quando o aluno encontra um lugar que faz sentido
      para ele, a participação cresce e o comprometimento floresce. A inovação começa pelo espaço!`;
    document.getElementById('next1').classList.remove('hidden');
    document.getElementById('next1').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
function finishPhase1(){ state.phase=2; updateHUD(); renderPhase2(); }

/* ============================================================
   FASE 2 — TECNOLOGIA CONSCIENTE (timeline)
============================================================ */
const phase2Activities = [
  {id:'t1', emoji:'🔍', label:'Pesquisa digital', cat:'digital'},
  {id:'t2', emoji:'📖', label:'Leitura e escrita', cat:'leitura'},
  {id:'t3', emoji:'🛠️', label:'Atividade prática', cat:'pratica'},
  {id:'t4', emoji:'💬', label:'Discussão em grupo', cat:'grupo'},
  {id:'t5', emoji:'📱', label:'Uso responsável de dispositivos', cat:'digital'},
];

function renderPhase2(){
  clearScreen();
  const div = document.createElement('div');
  div.className='screen';
  div.innerHTML = `
    <div class="mission-tag">Missão 2 · Tecnologia Consciente</div>
    <h2>Organize a rotina escolar</h2>

function setupSlotDrop(slot){
  slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
  slot.addEventListener('drop', e=>{
    e.preventDefault(); slot.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if(el) placeInSlot(slot, el);
  });
}
function handleSlotDrop(slot, el){ placeInSlot(slot, el); }
function placeInSlot(slot, el){
  const drop = slot.querySelector('.slot-drop');
  drop.querySelector('.placeholder')?.remove();
  // se já tem item, devolve ao pool
  const existing = drop.querySelector('.item');
  if(existing){
    const pool = document.getElementById('pool2');
    if(pool) pool.appendChild(existing);
  }
  drop.appendChild(el);
  checkPhase2();
}

  const filled = document.querySelectorAll('#timeline .slot-drop .item').length;
  if(filled===5 && !state.phase2Done){
    state.phase2Done = true;
    addScore(100,'fase2');
    updateHUD();
    // análise de equilíbrio
    const cats = Array.from(document.querySelectorAll('#timeline .slot .item')).map(el=>el.dataset.cat);
    const uniq = new Set(cats).size;
    let msg = '';
    if(uniq>=4){
      msg = '🌟 <strong>Excelente equilíbrio!</strong> Você alternou diferentes tipos de atividades, o que mantém a atenção, respeita o ritmo dos estudantes e usa a tecnologia de forma consciente.';
    } else if(uniq===3){

    }
    // destaca o uso de dispositivos
    const digitalCount = cats.filter(c=>c==='digital').length;
    msg += `<br><br>📱 Você reservou <strong>${digitalCount}</strong> momento(s) para uso de dispositivos — lembre-se: a tecnologia consciente serve à aprendizagem, não substitui as relações humanas.`;
    const fb = document.getElementById('fb2');
    fb.classList.remove('hidden');
    fb.innerHTML = msg;
    document.getElementById('next2').classList.remove('hidden');
  }
}
function finishPhase2(){ state.phase=3; updateHUD(); renderPhase3(); }
